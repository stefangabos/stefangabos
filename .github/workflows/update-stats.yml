name: Update stats

on:
  schedule:
    # every monday at 06:30 utc, after stefangabos.github.io has refreshed its numbers
    - cron: '30 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Render the stats card
        run: python3 .github/scripts/render_stats.py
      - name: Commit if anything changed
        run: |
          git add images README.md
          if git diff --cached --quiet; then
            echo 'stats unchanged'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Updated stats'
          git push
